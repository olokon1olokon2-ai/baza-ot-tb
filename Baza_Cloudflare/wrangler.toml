name = "baza-ot-tb"
main = "src/index.js"
compatibility_date = "2026-11-19"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "baza-ot-tb"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "baza-ot-tb-files"

[vars]
APP_NAME = "База — ЖК Олокон"
